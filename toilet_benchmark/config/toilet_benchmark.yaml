arrival:
  seed: 12345
  lambda_per_min: 6.0
  max_active_agents: 8

intent_distribution:
  urinal: 0.55
  stall: 0.30
  sink_only: 0.05
  pass_through: 0.10

service_time_sec:
  urinal: [20.0, 45.0]
  stall: [60.0, 180.0]
  sink: [10.0, 25.0]

queue_policy:
  max_queue_len_per_resource: 3
  choose_nearest_queue_slot: true

# E1 event runtime. Shadow computes and validates the new semantic trace while
# the proven director remains the live motion authority. Switch to takeover only
# after the same scene/seed passes an Isaac shadow smoke without mismatches.
scenario_runtime:
  mode: shadow
  shadow_strict: false
  smart_object_geometry:
    # Canonical oriented human capsule used by local hard safety and semantic
    # station occupancy. Keep these aligned with physx_diff_contact.yaml.
    pedestrian_radius_m: 0.26
    pedestrian_half_length_m: 0.16
    # The passage is the body-width corridor immediately behind a station.
    # Overlapping adjacent passages are tokenized; resource use remains concurrent.
    passage_depth_m: 0.90
    passage_clearance_m: 0.16
    passage_holding_offset_m: 0.45

director:
  live_pose_topic: /isaac/pedestrian_states
  arrival_tolerance_m: 0.18
  actor_stop_radius_m: 0.5
  exit_arrival_tolerance_m: 0.55
  # HuNav reaches the interaction point before the director begins the service
  # timer. Keep yaw and speed stable to prevent target-region micro-walking.
  urinal_final_yaw_tolerance_rad: 0.20
  urinal_final_alignment_stable_sec: 0.50
  urinal_final_alignment_max_speed_mps: 0.05
  walk_plane_z: 0.0
  pose_stale_sec: 5.0
  max_live_pose_jump_m: 3.0
  allow_eta_fallback: false
  exit_when_complete: true
  initial_spawn_interval_sec: 4.0
  # A trailing pre-spawned pedestrian waits until the previous pedestrian has
  # cleared the shared entrance, preventing symmetric HuNav repulsion there.
  initial_activation_clearance_m: 1.20
  serialize_exit_corridor: true
  portal_stall_recovery_sec: 3.0
  portal_max_recovery_attempts: 3
  portal_staging_arrival_tolerance_m: 0.20
  exit_staging_arrival_tolerance_m: 0.30
  # Compatibility backend cap. HuNav uses each agent's regular indoor speed.
  portal_crossing_velocity_mps: 0.45
  activation_settle_sec: 0.20
  activation_confirm_timeout_sec: 2.0
  activation_max_attempts: 3
  activation_confirmation_tolerance_m: 0.35
  motion_stall_recovery_sec: 4.0
  motion_max_recovery_attempts: 3
  # Root displacement refreshes the stall clock even while turning or moving laterally.
  stall_displacement_epsilon_m: 0.02
  # Recovery attempts reset only after meaningful progress toward the phase target.
  stall_progress_epsilon_m: 0.03
  # External-actor guard release must settle before stall timing resumes.
  guard_clear_grace_sec: 0.75
  pre_spawn_holding_origin: [1000.0, 1000.0, 0.0]
  pre_spawn_holding_offset: [0.0, 0.0, 0.0]
  pre_spawn_holding_axis: [1.0, 0.0, 0.0]
  pre_spawn_holding_spacing_m: 2.0

path_planner:
  enabled: true
  backend: voxel
  # HuNav takeover uses the static PhysX-derived map. The compatibility
  # isaac_people backend continues to use backend: voxel above.
  hunav_backend: walkable_map
  walkable_map_path: /home/stardust/resources/arena_ws/arena_assets/navigation/shenxinfu_841837.walkable.json
  # Match the swept-envelope lateral radius plus its hard clearance so the
  # global route does not repeatedly hand the local controller an unsafe line.
  # Keep the global route centerline away from geometry before the animated
  # capsule and local social motion are applied. 0.30 m still preserves the
  # measured entrance opening; larger worst-case circular inflation does not.
  walkable_agent_radius_m: 0.30
  walkable_nearest_free_radius_m: 0.60
  walkable_max_expansions: 30000
  walkable_simplify: true
  walkable_max_segment_length_m: 1.50
  # Near walls/corners, retain denser A* points instead of simplifying them
  # into a long diagonal that merely clears the inflated footprint.
  walkable_constrained_segment_length_m: 0.40
  walkable_preferred_clearance_m: 0.55
  walkable_clearance_cost_weight: 8.0
  walkable_turn_cost_weight: 0.25
  # Global replans sample the current and short-horizon predicted robot
  # footprint. Continuous robot motion remains a local-planner concern.
  robot_obstacle_mode: dynamic_replan
  voxel_map_path: /home/stardust/resources/arena_ws/arena_assets/collision_configs/shenxinfu_841837.voxel.json.gz
  z_min: 0.05
  z_max: 1.2
  agent_radius_m: 0.30
  bounds_padding_m: 1.0
  nearest_free_radius_m: 0.8
  max_expansions: 20000
  simplify: true
  max_segment_length_m: 2.0
  constrained_segment_length_m: 0.9
  preferred_clearance_m: 0.50
  clearance_cost_weight: 4.0
  turn_cost_weight: 0.35
  robot_odom_topic: /odom
  robot_obstacle_radius_m: 0.38
  # Global planning uses this oriented footprint instead of the conservative
  # circular robot_obstacle_radius_m. The circle remains for legacy yield
  # checks that do not have a heading-aware footprint.
  # Matches the main bridge profile guard: 0.70 x 0.42 m plus 0.02 m margin.
  robot_footprint_half_length_m: 0.37
  robot_footprint_half_width_m: 0.23
  robot_stationary_speed_threshold_mps: 0.05
  robot_stationary_soft_clearance_m: 0.05
  robot_moving_soft_clearance_m: 0.12
  robot_obstacle_timeout_sec: 1.0
  robot_prediction_horizon_sec: 0.75
  robot_yield_pedestrian_radius_m: 0.22
  robot_yield_clearance_m: 0.10

# Keep isaac_people as the compatibility default. Override with
# --motion-backend hunav for the Phase 1 single-agent takeover.
motion_backend:
  type: isaac_people
  hunav_namespace: /toilet_hunav_takeover
  # E2-B explicit takeover candidate. It is selected only with
  # --motion-backend local_motion; the default HuNav/Isaac behavior is unchanged.
  local_motion:
    compute_hz: 10.0
    external_motion_topic: /isaac/pedestrian_external_motion
    state_timeout_sec: 0.5
    # MovePed is an asynchronous service. Keep the external command alive
    # across short service/Isaac frame stalls so locomotion does not alternate
    # between Walk and Idle.
    external_timeout_sec: 1.0
    lookahead_distance_m: 0.70
    settled_arrival_tolerance_m: 0.25
    terminal_align_yaw_tolerance_rad: 0.15
    terminal_align_max_speed_mps: 0.05
    # Conservative speed band currently validated by the straight-path test.
    # This is not a permanent stock-character limit; faster bands require
    # separate straight/turning calibration before changing this baseline.
    embodiment_max_speed_mps: 0.31
    agent_radius_m: 0.26
    behavior:
      conflict_horizon_sec: 2.0
      minimum_passing_clearance_m: 0.45
      following_speed_scale: 0.8
    sampled_rvo:
      time_horizon_sec: 2.0
      neighbor_distance_m: 3.0
      clearance_m: 0.05
      angular_samples: 36
      speed_samples: [1.0, 0.875, 0.75, 0.625, 0.5, 0.375, 0.25]
      boundary_samples: 3
      max_acceleration_mps2: 2.0
      max_heading_rate_rps: 4.188790
      # Extra surface-to-surface comfort margin. It is reduced automatically
      # when nearby static geometry cannot support the open-space value.
      dynamic_clearance_target_m: 0.15
      dynamic_clearance_weight: 8.0
      # Once actors already overlap, only candidates that increase separation
      # may proceed; the forward-route filter deterministically selects who goes.
      overlap_recovery_horizon_sec: 0.50
      overlap_recovery_min_gain_m: 0.005
    safety:
      swept_envelope:
        # Local-motion uses the animated body capsule, not only the root point.
        # The radius is also clamped to agent_radius_m by the backend.
        disc_radius_m: 0.26
        half_length_m: 0.16
        clearance_m: 0.02
        axis_sample_spacing_m: 0.05
        sweep_sample_spacing_m: 0.02
        angular_sample_step_rad: 0.087266
        clip_iterations: 12
  hunav:
    compute_hz: 10.0
    # E2-B comparison only. When enabled, the deterministic sampled-RVO
    # candidate observes the same local world and reports velocity deltas;
    # HuNav remains the sole motion authority until the micro-scene gate passes.
    local_motion_shadow:
      enabled: false
      time_horizon_sec: 2.0
      neighbor_distance_m: 3.0
      clearance_m: 0.05
      angular_samples: 36
      conflict_horizon_sec: 2.0
      minimum_passing_clearance_m: 0.45
    # Experimental main path: let walkable-map routes run continuously across
    # the doorway instead of rebuilding point-based entry/exit portal paths.
    use_portal_controller: false
    state_topic: /isaac/pedestrian_states
    robot_odom_topic: /odom
    state_timeout_sec: 0.5
    external_timeout_sec: 0.35
    # A lost Isaac service response must not freeze one runtime forever.
    external_future_deadline_sec: 1.0
    external_retry_cooldown_sec: 1.0
    # Reject stale HuNav references after a freeze/rebase before they can
    # become a visible teleport.
    max_hunav_step_speed_factor: 2.0
    max_hunav_step_min_m: 0.03
    # Event-driven global replans are rate-limited; HuNav still runs at 10 Hz.
    global_replan_min_interval_sec: 1.5
    # Preserve the last safe lookahead through brief map/pose jitter rather
    # than freezing on a single failed visibility check.
    route_visibility_grace_sec: 0.5
    # Reuse a nearby forward lookahead when replacing a global route so the
    # local controller does not receive an abrupt heading reset.
    route_splice_max_cross_track_m: 0.35
    # HuNav's personal-space envelope remains conservative, while route
    # feasibility and the final no-overlap guard use the measured body proxy.
    social_radius_m: 0.30
    planning_radius_m: 0.26
    hard_radius_m: 0.26
    # Bound integration after service/reset pauses so roster changes cannot
    # turn one delayed HuNav response into a visible position jump.
    max_compute_dt_sec: 0.20
    # Keep HuNav's terminal condition tighter than the director's normal
    # tolerance. The backend separately reports its settled state.
    goal_radius_m: 0.12
    lookahead_distance_m: 0.80
    # Reject projection onto a nearby but topologically later route segment.
    lookahead_projection_window_m: 1.50
    lookahead_progress_slack_m: 0.15
    lookahead_max_cross_track_m: 0.80
    # Keep normal HuNav motion inside the validated global corridor. Explicit
    # local avoidance routes bypass this clamp and retain side-passing freedom.
    route_corridor_half_width_m: 0.30
    # The one-shot regular-avoidance waypoint is consumed within this radius;
    # it is separate from final semantic-goal arrival.
    local_waypoint_tolerance_m: 0.22
    settled_arrival_tolerance_m: 0.35
    # Position arrival starts terminal alignment; settlement is reported only
    # after live Isaac yaw and speed remain within these limits.
    terminal_align_yaw_tolerance_rad: 0.15
    terminal_align_max_speed_mps: 0.05
    terminal_align_stable_sec: 0.40
    # Moving robots retain the conservative full-body envelope. A stationary
    # robot uses a tighter envelope so visual free space is not rejected early.
    robot_radius_m: 0.45
    stationary_robot_radius_m: 0.36
    stationary_robot_linear_speed_threshold_mps: 0.05
    stationary_robot_angular_speed_threshold_rps: 0.10
    # The oriented capsule footprint is shared by global planning, passing
    # corridors and final hard safety. The radii above remain HuNav's social
    # representation rather than a second geometric collision model.
    robot_footprint_half_length_m: 0.36
    robot_footprint_half_width_m: 0.27
    robot_stationary_soft_clearance_m: 0.05
    robot_moving_soft_clearance_m: 0.12
    # Reset/teleport services are discontinuities, not physical robot sweeps.
    robot_pose_reset_jump_m: 0.75
    behavior:
      social_force_factor: 5.0
      goal_force_factor: 2.0
      obstacle_force_factor: 10.0
      other_force_factor: 20.0
      # HuNav's surprised BT only remains active while its duration timer is
      # running. A zero duration falls through to regular navigation.
      surprised:
        configuration: custom
        # Keep the upstream one-shot timer alive for the full encounter. The
        # BT visibility condition still releases the pedestrian when the robot
        # leaves, while a short timer would silently fall back to REGULAR.
        duration: 60.0
        once: true
        dist: 1.10
      scared:
        configuration: custom
        # Scared uses the same upstream timer gate as surprised. Zero duration
        # makes every visible-robot tick fall through to regular navigation.
        duration: 60.0
        once: true
        dist: 1.10
    robot_proximity_reaction:
      enabled: false
      mode: fixed
      reaction: regular
      trigger:
        # Start social avoidance before the hard-contact envelope is reached.
        distance_m: 1.10
        time_to_collision_sec: 1.5
        front_half_angle_deg: 180.0
      release:
        distance_m: 1.25
        stable_sec: 0.8
      reactions:
        yielding:
          speed_scale: 0.0
          weight: 0.55
        impatient:
          speed_scale: 1.35
          weight: 0.05
        regular:
          speed_scale: 1.0
          weight: 0.40
    # Regular pedestrians choose one walkable side of a blocking robot and
    # keep that side until the encounter is over.
    regular_avoidance:
      enabled: true
      trigger_distance_m: 1.10
      side_clearance_m: 0.10
      forward_offset_m: 0.55
      # Search conservative to tight safe corridors instead of treating one
      # fixed lateral offset as proof that an entire side is blocked.
      clearance_samples_m: [0.10, 0.06, 0.02]
      forward_offset_samples_m: [0.55, 0.75]
      release_distance_m: 1.25
      # Score the complete temporary corridor against the static map and a
      # constant-velocity robot prediction before selecting a passing side.
      prediction_horizon_sec: 1.50
      sample_spacing_m: 0.10
      min_dynamic_clearance_m: 0.01
      # Keep the lateral part of HuNav's social response, but do not let the
      # radial robot force turn a passing maneuver into a retreat.
      suppress_backward_motion: true
      # Weighted behavior remains active in open space. If both passing sides
      # fail the same walkable-map test, latch yielding for this encounter.
      geometry_override_enabled: true
      narrow_space_fallback: yielding
      # A pedestrian waiting at a semantic resource is a fixed obstacle, not
      # another social-force participant to push around. If the static map,
      # robot footprint, and fixed pedestrian jointly close both passing
      # sides, the approaching pedestrian waits before contact and resumes
      # only after the corridor is stably available again.
      pedestrian_yield:
        enabled: true
        trigger_distance_m: 0.95
        release_distance_m: 1.10
        side_clearance_m: 0.08
        forward_offset_m: 0.45
        release_confirm_ticks: 5
      # Do not cancel a latched passing corridor on one noisy prediction tick.
      active_route_infeasible_confirm_ticks: 4
      stall_timeout_sec: 2.0
      stall_progress_epsilon_m: 0.03
      # One local recovery is allowed before dynamic Theta* or yielding.
      max_recovery_attempts: 1
    safety:
      enabled: true
      clearance_m: 0.01
      contact_epsilon_m: 0.0001
      max_iterations: 8
      # Calibrated from the animated skeleton envelope. The capsule is checked
      # continuously over translation and yaw, not only at the root endpoint.
      swept_envelope:
        # Calibrated from the local-frame skeleton hull plus the 8 cm visual
        # overlap sampling radius. The planner remains conservative without
        # turning the 0.9 m entrance into a false blocked corridor.
        disc_radius_m: 0.20
        half_length_m: 0.125
        clearance_m: 0.01
        axis_sample_spacing_m: 0.05
        sweep_sample_spacing_m: 0.02
        angular_sample_step_rad: 0.087266
        clip_iterations: 12
      # A clipped near-zero step must not turn the character toward numerical
      # left/right alternatives on every HuNav tick.
      constrained_yaw_speed_threshold_mps: 0.12
    visualization:
      enabled: true
      frame_id: map
      route_topic: /toilet_benchmark/hunav/route
      marker_topic: /toilet_benchmark/hunav/markers
      diagnostic_log_period_sec: 1.0

hunav_profile:
  regular:
    desired_velocity: [0.9, 1.2]
    behavior_type: REGULAR

  surprised:
    desired_velocity: [0.9, 1.2]
    behavior_type: SURPRISED

  scared:
    desired_velocity: [0.9, 1.2]
    behavior_type: SCARED

  impatient:
    # desired_velocity: [1.1, 1.5]
    desired_velocity: [0.9, 1.2]
    behavior_type: THREATENING

character_pool:
  - original_female_adult_business_02
  - original_female_adult_medical_01
  - original_female_adult_police_01
  - original_female_adult_police_02
  - original_female_adult_police_03
  - original_male_adult_construction_01
  - original_male_adult_construction_02
  - original_male_adult_construction_03
  - original_male_adult_construction_05
  - original_male_adult_medical_01
  - original_male_adult_police_04
