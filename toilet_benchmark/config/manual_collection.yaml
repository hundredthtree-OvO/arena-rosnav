session:
  output_root: /home/stardust/resources/arena_ws/data/toilet_manual
  operator_id: operator_01
  # gamepad for local collection; set keyboard_diff when using remote WASD.
  control_source: gamepad
  seed: 42
  selection_mode: fixed
  fixed_scenario_id: narrow_head_on_003
  # Each episode uses a fresh Isaac People incarnation. Restart the bridge
  # between sessions to release the parked AnimGraph instances.
  max_episodes: 10
  inter_episode_delay_sec: 1.0
  parking_timeout_sec: 5.0
  authored_runtime_exit_timeout_sec: 60.0

episode:
  timeout_sec: 120.0
  goal_tolerance_m: 0.35
  goal_stop_speed_mps: 0.08
  settle_timeout_sec: 8.0
  settle_min_stable_sec: 0.6
  settle_position_tolerance_m: 0.08
  settle_yaw_tolerance_rad: 0.12
  settle_linear_speed_mps: 0.03
  settle_angular_speed_rps: 0.08

robot:
  name: xms_mecanum
  reset_service: /isaac/reset_mecanum_episode
  control_hold_service: /isaac/set_mecanum_control_hold
  odom_topic: /odom

# Manual collection does not alter operator commands before contact. A zero-margin
# robot/pedestrian envelope contact immediately fails and finalizes the episode.
collision_policy:
  pedestrian_robot: detect_and_fail
  hard_guard_service: /isaac/set_pedestrian_hard_guard

pedestrian:
  # Cleanup service settings only. Actors and characters come from EpisodeSpec.
  agent_id: toilet_agent_01
  count: 1
  parking_service: /isaac/delete_prim

recording:
  enabled: true
  command: [ros2, bag, record]
  ready_timeout_sec: 10.0
  # Only require continuously available bridge topics. Optional event topics
  # may have no publisher until an event occurs and must not gate bag readiness.
  ready_topics: [/odom, /cmd_vel_applied, /front_scan, /rear_scan]
  topics:
    - /clock
    - /tf
    - /tf_static
    - /cmd_vel_gamepad_diff
    - /cmd_vel_applied
    - /odom
    - /front_scan
    - /rear_scan
    - /isaac/pedestrian_states
    - /toilet_benchmark/collection_status
    - /isaac/pedestrian_hard_guard_events
    - /isaac/pedestrian_contact_events
    - /isaac/scene_collision_events

events:
  pedestrian_status_topic: /toilet_benchmark/pedestrian_runtime_status
  hard_guard_topic: /isaac/pedestrian_hard_guard_events
  pedestrian_contact_topic: /isaac/pedestrian_contact_events
  scene_collision_topic: /isaac/scene_collision_events

scenario_source:
  # Default collection path: the Route Editor EpisodeSpec is the scenario truth.
  mode: authored_route

scenarios:
  - id: narrow_head_on_003
    enabled: true
    weight: 1.0
    episode_path: /home/stardust/resources/arena_ws/src/arena/arena-rosnav/toilet_benchmark_ui/examples/narrow_head_on_003.json
