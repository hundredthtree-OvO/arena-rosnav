seed: 42

scenarios:
- single_pause_resume
- head_on
- crossing
- narrow_passage
- narrow_gate
- toilet_portal_corridor
- static_robot
- moving_robot

simulation:
  dt_sec: 0.05
  duration_sec: 20.0
  startup_timeout_sec: 15.0
  service_timeout_sec: 2.0
  seed_jitter_m: 0.02

behavior:
  social_force_factor: 5.0
  goal_force_factor: 2.0
  obstacle_force_factor: 10.0
  other_force_factor: 20.0

safety:
  enabled: true
  clearance_m: 0.01
  contact_epsilon_m: 0.0001
  static_obstacle_radius_m: 0.03
  max_iterations: 8

coordination:
  enabled: true

terminal_alignment:
  enabled: true

obstacle_sampling:
  nearest_count: 6
  max_distance_m: 0.45

thresholds:
  goal_slack_m: 0.15
  completion_speed_mps: 0.05
  final_yaw_tolerance_rad: 0.25
  overlap_radius_scale: 0.90
  pose_jump_min_m: 0.20
  pose_jump_slack_m: 0.10
  motion_yaw_speed_mps: 0.10
  stall_window_sec: 3.0
  stall_displacement_m: 0.05
  portal_center_band_m: 0.20
  portal_stop_speed_mps: 0.05
  portal_center_stop_max_frames: 5
  portal_center_stop_max_sec: 0.25
  portal_reverse_progress_epsilon_m: 0.01
